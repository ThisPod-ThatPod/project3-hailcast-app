# simulator — 1 replica 고정(시연 부하 발원지, 여러 개 뜨면 트래픽 카운트가 꼬임)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailcast-simulator
  namespace: hailcast
spec:
  replicas: 1
  selector:
    matchLabels: { app: hailcast-simulator }
  template:
    metadata:
      labels: { app: hailcast-simulator }
    spec:
      serviceAccountName: simulator-sa
      containers:
        - name: simulator
          image: <ECR>/hailcast-dev-simulator:<GITHUB_SHA>
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: hailcast-config }
          env:
            - { name: CALL_API_URL, value: "http://hailcast-call-api:8000" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5  # [B-1, 2026-07-24] 최대부하(600rps)에서 CPU 1000m 줘도
                                  # 여전히 순간적으로 이벤트루프가 밀려 기본 타임아웃/횟수로는
                                  # 재시작되는 것 실측함 — 데모용 부하발생기라 잠깐의 헬스체크
                                  # 지연 정도는 "죽음"으로 취급하지 않고 여유를 크게 둔다.
          resources:
            # [B-1, 2026-07-24] k6가 call-api를 직결하던 걸 relay 경유로 바꾸면서 simulator
            # 자신도 트래픽만큼 CPU를 쓰게 됨(전엔 거의 0) — call-api 증설 때와 같은 이유로 상향.
            # memory: 512Mi에서 최대부하(600rps) 램프 직후 OOMKilled(exitCode 137) 실측함 —
            # k6 자체가 call_load.js의 maxVUs=rps*5만큼 VU를 미리 할당하는데, 전엔 k6가
            # call-api를 직결해서 이 파드 자신은 거의 안 썼던 메모리를, relay 경유로 바뀌면서
            # FastAPI+httpx 커넥션풀 몫까지 같은 컨테이너 메모리에 더해 쓰게 됐다.
            #
            # 2026-07-27 (cpu 2000m→3000m, max_tps 600→300과 세트): relay 요청 1건당
            # httpx 클라이언트 자체 오버헤드가 실측 ~5.83ms — 300 TPS 기준 초당 ~1.75코어
            # 필요. 2코어(2000m) 한도에선 87.5% 사용이라 GC/k6 자체 몫까지 감안하면 여전히
            # 빠듯해서, 3코어로 올려 58% 사용까지 여유를 만든다(docs/2026-07-27-findings.md).
            requests: { cpu: 300m, memory: 512Mi }
            limits: { cpu: 3000m, memory: 1280Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hailcast-simulator
  namespace: hailcast
spec:
  selector: { app: hailcast-simulator }
  ports: [{ port: 8001, targetPort: 8001 }]
