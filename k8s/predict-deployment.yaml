# 예시: predict Deployment — Probe·Resource·ConfigMap/Secret 참조 계약
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailcast-predict
spec:
  replicas: 1   # forecast/scaling 스케줄러 중복 실행 방지 — 반드시 1
  selector:
    matchLabels: { app: hailcast-predict }
  template:
    metadata:
      labels: { app: hailcast-predict }
    spec:
      serviceAccountName: hailcast-predict   # IRSA(S3/SQS) + ScaledObject RBAC
      containers:
        - name: predict
          image: <ECR>/hailcast-predict:latest
          ports: [{ containerPort: 8003 }]
          envFrom:
            - configMapRef: { name: hailcast-config }
            - secretRef: { name: hailcast-secret }   # DB_PASSWORD
          env:
            - { name: KEDA_ENABLED, value: "true" }
          livenessProbe:
            httpGet: { path: /live, port: 8003 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8003 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
