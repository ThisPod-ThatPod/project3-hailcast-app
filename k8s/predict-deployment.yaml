# 예시: predict Deployment — Probe·Resource·ConfigMap/Secret 참조 계약
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailcast-predict
  # 07-13 네이밍 규약에 따른 변수명 및 코드 수정 중 A-3. 매니페스트에 Namespace 미명시
  namespace: hailcast   # 네이밍규약서 §8 — 앱 워크로드 네임스페이스
spec:
  replicas: 1   # forecast/scaling 스케줄러 중복 실행 방지 — 반드시 1
  selector:
    matchLabels: { app: hailcast-predict }
  template:
    metadata:
      labels: { app: hailcast-predict }
    spec:
      # 07-13 네이밍 규약에 따른 변수명 및 코드 수정 중 3. ServiceAccount 이름 어긋남
      serviceAccountName: predict-sa   # 네이밍규약서 §5-3 IRSA 표: hailcast:predict-sa
      containers:
        - name: predict
          # 07-13 네이밍 규약에 따른 변수명 및 코드 수정 중 A-2. ECR 태그 (규약 §8: 태그는 CI가 $GITHUB_SHA로 주입, latest 배포 금지)
          image: <ECR>/hailcast-dev-predict:<GITHUB_SHA>
          ports: [{ containerPort: 8003 }]
          envFrom:
            - configMapRef: { name: hailcast-config }
            - secretRef: { name: hailcast-rds-secret }   # ESO가 채움: DB_USER/DB_PASSWORD (§8-2)
          livenessProbe:
            # ⚠️ 2026-07-20 정정: predict 실제 엔드포인트는 /healthz 하나뿐(/live, /ready 없음).
            httpGet: { path: /healthz, port: 8003 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8003 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: hailcast-predict
  namespace: hailcast
spec:
  selector: { app: hailcast-predict }
  ports: [{ port: 8003, targetPort: 8003 }]
