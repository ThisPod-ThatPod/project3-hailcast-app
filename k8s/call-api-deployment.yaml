# call-api Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hailcast-call-api
  namespace: hailcast
spec:
  replicas: 4   # 2026-07-22: simulator max_tps 200→600 인상에 맞춰 2→4로 증설(고정, HPA 아님 — predict와 달리 상태 없음, 여러 개 떠도 안전)
  selector:
    matchLabels: { app: hailcast-call-api }
  template:
    metadata:
      labels: { app: hailcast-call-api }
    spec:
      serviceAccountName: call-api-sa
      containers:
        - name: call-api
          image: <ECR>/hailcast-dev-call-api:<GITHUB_SHA>
          # 포트에 이름을 붙인다 — 아래 Service 의 targetPort 와 ServiceMonitor 가 이 이름을 참조한다.
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: hailcast-config }
            - secretRef: { name: hailcast-rds-secret }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hailcast-call-api
  namespace: hailcast
spec:
  selector: { app: hailcast-call-api }
  # name: http 는 생략하면 안 된다 — ServiceMonitor 의 endpoints[].port 는 포트 "이름"을
  # 참조하므로(번호가 아니다), 이름이 없으면 스크레이프 대상이 0개가 된다.
  # 에러가 아니라 "타겟이 안 잡히는" 형태라 조용히 실패한다.
  # Ingress 는 포트를 번호(number: 8000)로 참조하므로 이름 추가는 비파괴적이다.
  ports: [{ name: http, port: 8000, targetPort: http }]
