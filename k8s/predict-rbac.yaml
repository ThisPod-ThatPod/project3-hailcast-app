# 예시: predict가 ScaledObject를 Read/Patch하기 위한 최소 RBAC
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hailcast-scaledobject-patcher
rules:
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hailcast-predict-scaledobject
subjects:
  - kind: ServiceAccount
    # 07-13 네이밍 규약에 따른 변수명 및 코드 수정 중 3. ServiceAccount 이름 어긋남
    # name: hailcast-predict
    name: predict-sa
roleRef:
  kind: Role
  name: hailcast-scaledobject-patcher
  apiGroup: rbac.authorization.k8s.io
