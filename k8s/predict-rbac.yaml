# 예시: predict가 ScaledObject를 Read/Patch하기 위한 최소 RBAC
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hailcast-scaledobject-patcher
rules:
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hailcast-predict-scaledobject
subjects:
  - kind: ServiceAccount
    name: hailcast-predict
roleRef:
  kind: Role
  name: hailcast-scaledobject-patcher
  apiGroup: rbac.authorization.k8s.io
