# RDS 비번 → K8s Secret 복제 (네이밍규약서 §5-4/§8-2 ESO 방식).
# call-api/worker/predict 3개 Deployment가 이 Secret 하나를 공유한다(ExternalSecret 1개만).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hailcast-rds-secret
  namespace: hailcast
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hailcast-rds-secret   # 이 이름을 predict/worker/call-api Deployment의 secretRef가 참조
    creationPolicy: Owner
  # RDS manage_master_user_password=true가 자동 생성하는 시크릿은 {"username":..,"password":..} 형태.
  # dataFrom이 아니라 data로 개별 키를 매핑해서, 우리 앱이 기대하는 이름(DB_USER/DB_PASSWORD)으로 바꾼다.
  data:
    - secretKey: DB_USER
      remoteRef:
        key: ${RDS_MASTER_SECRET_ARN}   # terraform output rds_master_secret_arn
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ${RDS_MASTER_SECRET_ARN}
        property: password
