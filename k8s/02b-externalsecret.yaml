# ⚠️⚠️ 참고용 — 이 파일은 배포 소스가 아님. 재구축 시 이 파일을 그대로 적용하지 말 것. ⚠️⚠️
# ------------------------------------------------------------------------------------
# 실제 배포/진실 소스: manifests 레포
#   github.com/ThisPod-ThatPod/project3-hailcast-manifests  (path: platform/external-secrets, branch: dev)
#   → ArgoCD Application 'platform-secrets' 가 이 경로를 클러스터에 싱크한다.
#   이 앱 레포(project3-hailcast-app) k8s/ 는 어떤 ArgoCD Application의 소스도 아니다(= 클러스터에 반영 안 됨).
#
# 실제 상태(2026-08-02 EKS hailcast-dev-eks 확인):
#   · ExternalSecret 2개 — rds-credentials(Secrets Manager) + rds-endpoint(Parameter Store)
#   · 둘 다 creationPolicy: Merge  (같은 타겟 Secret 'hailcast-rds-secret'에 키만 병합)
#   · 결과 Secret 키: DB_USER / DB_PASSWORD / DB_HOST
#
# 왜 Owner가 아니라 Merge인가 (되돌리지 말 것):
#   두 ExternalSecret이 동일한 Secret 'hailcast-rds-secret' 하나를 나눠 채운다.
#   Owner로 두면 각 ES가 Secret 소유권을 갖고 '자기가 관리하지 않는 키'를 제거해,
#   두 ES가 서로의 키(예: DB_HOST)를 밀어내는 충돌이 난다.
#   → 2026-07-22 커밋 0c67287 (Fix(argocd): rds-credentials creationPolicy Owner → Merge)에서
#     의도적으로 Owner를 제거함. 재구축 때 Owner/1개로 되돌리면 그 충돌이 그대로 재현된다.
#
# 아래 내용은 manifests 실제 소스를 미러링한 '참고 사본'이다. 수정이 필요하면
# 반드시 manifests 레포 platform/external-secrets 에서 변경할 것.
# ====================================================================================

---
# RDS 마스터 비밀번호(Secrets Manager, manage_master_user_password로 자동 생성됨)
# → K8s Secret hailcast-rds-secret 의 DB_USER / DB_PASSWORD 키로 병합(Merge)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: hailcast
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: hailcast-rds-secret
    creationPolicy: Merge
  data:
    - secretKey: DB_USER
      remoteRef:
        key: "arn:aws:secretsmanager:ap-northeast-2:797452357900:secret:rds!db-d9ecba11-0893-4a4e-94d1-5ce0c425c223-DffHUP"
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "arn:aws:secretsmanager:ap-northeast-2:797452357900:secret:rds!db-d9ecba11-0893-4a4e-94d1-5ce0c425c223-DffHUP"
        property: password
---
# RDS 엔드포인트(Parameter Store, 비용 절감을 위해 일반 설정값은 여기 저장)
# → 같은 hailcast-rds-secret에 DB_HOST 키로 병합(Merge)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-endpoint
  namespace: hailcast
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: hailcast-rds-secret
    creationPolicy: Merge   # rds-credentials와 동일하게 Merge. 둘 다 생성 주체가 아니라
                            # 기존 Secret에 키만 병합한다 (0c67287 이후 상태)
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /hailcast/dev/rds/endpoint   # 네이밍규약서 §5-7과 정확히 일치
