# 앱 5종 ServiceAccount — IRSA 역할과 신뢰관계를 맺는 지점(네이밍규약서 §5-3).
# ${...} 값은 `terraform output -json eks_irsa_role_arns`에서 채운다 (배포 가이드 참고).
# eso/keda/karpenter/lbctrl/monitoring의 SA는 각 애드온 Helm 차트가 만들거나
# 배포팀이 별도로 만든다 — 여기는 "우리 앱 5종"만 다룬다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: predict-sa
  namespace: hailcast
  annotations:
    eks.amazonaws.com/role-arn: ${PREDICT_IRSA_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: call-api-sa
  namespace: hailcast
  annotations:
    eks.amazonaws.com/role-arn: ${CALL_API_IRSA_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: hailcast
  annotations:
    eks.amazonaws.com/role-arn: ${WORKER_IRSA_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weather-cron-sa
  namespace: hailcast
  annotations:
    eks.amazonaws.com/role-arn: ${WEATHER_CRON_IRSA_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simulator-sa
  namespace: hailcast
  annotations:
    eks.amazonaws.com/role-arn: ${SIMULATOR_IRSA_ROLE_ARN}
