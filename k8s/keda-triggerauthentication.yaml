# KEDA가 SQS 큐 길이를 조회할 때 쓰는 인증 — irsa-keda 역할을 IRSA로 문다.
# worker-scaledobject.yaml의 authenticationRef가 이 이름(hailcast-keda-auth)을 지목한다.
# KEDA operator 자신의 ServiceAccount(keda:keda-operator)에 이미 IRSA 역할이 붙어 있어야
# 이 TriggerAuthentication의 podIdentity가 그 자격을 그대로 물려받는다.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: hailcast-keda-auth
  namespace: hailcast
spec:
  podIdentity:
    provider: aws-eks
