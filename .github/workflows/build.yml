# 9.1 build→ECR push (OIDC·SHA 태그) + manifests 이미지 태그 자동 반영 (안건 A / Option A1)
#
# 변경된 서비스만 빌드한다. 예전엔 한 줄만 고쳐도 5개를 전부 빌드·push 해서
# 내용이 같은 이미지가 태그만 달리 ECR 에 쌓였다.
#
# ⚠️ 핵심 불변조건: 매니페스트는 '이번 실행에서 실제로 빌드된 서비스'만 갱신한다.
#    빌드만 좁히고 매니페스트를 전부 갱신하면, 빌드 안 된 서비스가
#    ECR 에 없는 태그를 가리켜 ImagePullBackOff 가 난다.
name: build-and-push

on:
  push:
    # dev: 배포 흐름의 시작점(여기 머지되면 manifests 가 갱신된다).
    # main: 이미지만 빌드해 둔다(아래 update-manifests 는 dev 에서만 돈다).
    branches: [main, dev]
    # 1차 거름망. 여기 걸려도 아래 detect 가 서비스 단위로 한 번 더 좁힌다.
    # 루트 common/·predict/ 는 레포에 존재하지 않는 잔재라 제거했다(어떤 Dockerfile 도 COPY 하지 않음).
    paths:
      - 'backend/**'
      - 'frontend/**'      # frontend 는 소스가 backend/ 밖에 있다(frontend/Dockerfile).
      - 'ml/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# 같은 브랜치의 실행을 직렬화해 manifests dev 로 동시에 push 하는 경합을 줄인다.
#
# ⚠️ cancel-in-progress 는 false 여야 한다. 위의 '변경된 서비스만 빌드' 와 짝이다.
#    취소하면 이렇게 된다:
#      Push A(worker 수정) 빌드 중 → Push B(call-api 수정) 가 A 를 취소
#      → B 의 diff 는 call-api 뿐 → worker 는 이번에도, 아까도 빌드되지 않음
#      → worker 코드는 dev 에 있는데 그 SHA 의 이미지가 ECR 에 없고
#        매니페스트는 옛 태그를 유지한다(안전장치 8번이 정상 동작한 결과).
#      → 에러 하나 없이 worker 변경만 영영 배포되지 않는다.
#    예전에는 매 실행이 5개를 전부 빌드해서 뒤 실행이 취소분을 덮어줬기 때문에 안전했다.
#    변경 감지를 넣으면서 그 전제가 사라졌다.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC — 장기 AWS 키 없이 AssumeRole
  contents: read

env:
  AWS_REGION: ap-northeast-2
  # 빌드 대상 전체 목록. 새 서비스는 여기 먼저 추가한 뒤 매니페스트를 올린다.
  # frontend 는 소스·Dockerfile 위치가 다르다(아래 detect·build 에서 분기).
  ALL_SERVICES: call-api worker predict simulator weather-cron frontend

jobs:
  # ── 이번 커밋이 실제로 건드린 서비스 판별 ──
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.d.outputs.services }}    # JSON 배열 (matrix 용)
      list: ${{ steps.d.outputs.list }}            # 공백 구분 (스크립트 용)
    steps:
      - uses: actions/checkout@v4
        with:
          # 이전 커밋과 비교해야 하므로 전체 이력이 필요하다.
          fetch-depth: 0

      - name: Detect changed services
        id: d
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"

          # 판단 근거가 없으면 안전하게 전부 빌드한다.
          #   - workflow_dispatch: 비교할 이전 커밋이 없다
          #   - 새 브랜치 최초 push: before 가 0000...
          #   - force push 등으로 before 커밋이 사라진 경우
          if [ "${{ github.event_name }}" != "push" ] \
             || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "비교 기준 없음 → 전체 빌드"
            changed="$ALL_SERVICES"
          else
            files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            echo "변경 파일:"; echo "$files" | sed 's/^/  /'

            # 워크플로가 바뀌면 판별 규칙 자체가 달라질 수 있다 → 안전하게 전부(frontend 포함).
            build_all=false
            echo "$files" | grep -qE '^\.github/workflows/build\.yml$' && build_all=true

            if $build_all; then
              changed="$ALL_SERVICES"
            else
              changed=""
              # backend/common 은 '백엔드' 서비스가 모두 COPY 한다. frontend 는 COPY 하지 않으므로 제외.
              common_changed=false
              echo "$files" | grep -qE '^backend/common/' && common_changed=true

              for s in $ALL_SERVICES; do
                # frontend 는 소스가 backend/ 밖에 있다(frontend/Dockerfile).
                case "$s" in
                  frontend) src="^frontend/" ;;
                  *)        src="^backend/${s}/" ;;
                esac
                if echo "$files" | grep -qE "$src"; then
                  changed="$changed $s"
                elif $common_changed && [ "$s" != "frontend" ]; then
                  changed="$changed $s"
                fi
              done
              # predict 만 루트 ml/ 을 COPY 한다(Dockerfile: COPY ml /app/ml).
              if echo "$files" | grep -qE '^ml/'; then
                case " $changed " in *" predict "*) ;; *) changed="$changed predict" ;; esac
              fi
            fi
          fi

          changed="$(echo $changed | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ' | sed 's/ *$//')"

          if [ -z "$changed" ]; then
            # 루트 common/·predict/ 처럼 어떤 Dockerfile 도 COPY 하지 않는 경로만 바뀐 경우.
            # 이미지 내용이 달라지지 않으므로 빌드하지 않는다.
            echo "빌드 대상 없음 — 이미지에 영향 주는 변경이 없다."
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "빌드 대상: $changed"
            echo "services=$(printf '%s\n' $changed | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
            echo "list=$changed" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 07-13 네이밍 규약에 따른 변수명 및 코드 수정 중 A-2. ECR 태그 (규약 §8: 태그는 커밋 SHA만, latest 금지)
      - name: Build and push (SHA 태그)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: hailcast-dev-${{ matrix.service }}
          SERVICE: ${{ matrix.service }}
        run: |
          # frontend 만 Dockerfile 이 backend/ 밖에 있다.
          # 또한 frontend 는 VITE_* 를 build-arg 로 받아야 한다 — Vite 환경변수는 빌드 시점에
          # JS 번들에 문자열로 박히므로(런타임 env 아님) 매니페스트 env 로는 못 바꾼다.
          BUILD_ARGS=()
          case "$SERVICE" in
            frontend)
              DOCKERFILE="frontend/Dockerfile"
              # 운영은 same-origin(CloudFront 가 / 와 /api 를 한 도메인으로 서빙)이라
              # 백엔드 base URL 을 빈 값으로 구워 프론트가 상대경로(/api/...)로 요청하게 한다.
              # 빈 값을 안 넘기면 Dockerfile 기본값(localhost)이 박혀 배포본이 localhost 를 부른다.
              BUILD_ARGS+=(--build-arg VITE_CALL_API_BASE_URL="")
              BUILD_ARGS+=(--build-arg VITE_SIMULATOR_BASE_URL="")
              ;;
            *)        DOCKERFILE="backend/${SERVICE}/Dockerfile" ;;
          esac
          # build context = 레포 루트 (backend/common·ml·frontend/ 등 COPY 경로가 루트 기준)
          docker build -f "$DOCKERFILE" \
            "${BUILD_ARGS[@]}" \
            -t "$REGISTRY/$IMAGE:${GITHUB_SHA::7}" .
          docker push "$REGISTRY/$IMAGE:${GITHUB_SHA::7}"

  # ── manifests 레포에 새 SHA 태그 반영 (안건 A) ──
  # matrix 안이 아니라 별도 job 이다. matrix 가 동시에 같은 레포로 push 하면 충돌한다.
  # needs: build 로 빌드가 모두 끝난 뒤 '한 번만' 순차 실행된다.
  update-manifests:
    needs: [detect, build]
    runs-on: ubuntu-latest
    # 배포 경로는 app dev → manifests dev 하나뿐이다. main push 는 이미지만 만들고 끝낸다.
    if: github.ref == 'refs/heads/dev'
    env:
      MANIFESTS_REPO: ThisPod-ThatPod/project3-hailcast-manifests
      # ArgoCD 가 바라보는 브랜치와 반드시 같아야 한다.
      # 다르면 태그가 갱신돼도 배포되지 않는다.
      BASE_BRANCH: dev
      # 이번 실행에서 실제로 빌드된 서비스. 이 목록만 갱신한다.
      BUILT: ${{ needs.detect.outputs.list }}
    steps:
      # 크로스 레포 자격증명을 개인 PAT 이 아니라 GitHub App 설치 토큰으로 받는다.
      # PAT 은 발급한 사람 계정에 묶여 있어 그 사람이 빠지거나 토큰을 회수하면 CD 가 멈춘다.
      # App 토큰은 사람에 안 묶이고 1 시간 만료라 유출 영향도 짧다.
      #
      # ⚠️ owner·repositories 를 반드시 지정한다. 생략하면 토큰이 '이 워크플로가 도는 레포'
      #    (= app) 로만 스코프돼 manifests 체크아웃이 404 로 죽는다. 크로스 레포가 요점이다.
      - name: Mint manifests token (GitHub App)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MANIFESTS_APP_ID }}
          private-key: ${{ secrets.MANIFESTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: project3-hailcast-manifests

      - name: Checkout manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFESTS_REPO }}
          ref: ${{ env.BASE_BRANCH }}
          # 크로스 레포라 기본 GITHUB_TOKEN 으로는 접근할 수 없다.
          # actions/checkout 이 이 토큰을 remote URL 에 심어두므로, 아래 git push 는
          # 따로 손댈 필요 없이 그대로 App 자격으로 나간다.
          token: ${{ steps.app-token.outputs.token }}
          # 얕은 클론에서는 아래 재시도의 rebase 가 제대로 동작하지 않는다.
          fetch-depth: 0

      - name: Update image tags
        id: sed
        run: |
          set -euo pipefail
          # build 잡이 push 에 쓴 태그와 반드시 같은 값이어야 한다.
          # 한 글자라도 다르면 ECR 에 없는 태그를 가리켜 ImagePullBackOff 가 난다.
          TAG="${GITHUB_SHA::7}"

          # 대상 목록을 따로 적지 않고 매니페스트를 직접 훑는다.
          # 목록을 두 곳에서 관리하면 한쪽만 고쳐 조용히 누락된다(실제로 call-api 가 그랬다).
          shopt -s nullglob
          updated=0
          for f in apps/*/deployment.yaml; do
            svc="$(basename "$(dirname "$f")")"

            # 우리 ECR 이미지 라인이 없으면 대상이 아니다(사이드카·외부 이미지 등).
            grep -qE "image:[[:space:]]*[^[:space:]]*hailcast-dev-${svc}:" "$f" || continue

            # ① 아예 빌드 대상이 아닌 서비스 → 매니페스트가 먼저 올라온 것이다.
            #    그대로 두면 ECR 에 없는 이미지를 가리키게 되므로 여기서 멈춘다.
            #    조치: app 레포 ALL_SERVICES 에 먼저 추가한 뒤 매니페스트를 올린다.
            case " $ALL_SERVICES " in
              *" $svc "*) ;;
              *) echo "::error file=${f}::${svc} 가 빌드 대상(ALL_SERVICES)에 없다. app 레포에 먼저 추가한다."; exit 1 ;;
            esac

            # ② 빌드 대상이지만 이번 커밋에서 안 바뀐 서비스 → 기존 태그를 그대로 둔다.
            #    이번 SHA 로는 그 서비스 이미지가 빌드되지 않았기 때문이다.
            case " $BUILT " in
              *" $svc "*) ;;
              *) echo "건너뜀: ${svc} (이번 커밋에서 변경 없음, 기존 태그 유지)"; continue ;;
            esac

            # 패턴을 <GITHUB_SHA> 리터럴로 잡으면 1회차에 플레이스홀더가 사라져 2회차부터
            # 아무것도 매칭되지 않고 '조용히' 실패한다. 이미지 라인을 통째로 잡아 태그만 교체한다.
            #   \1 역참조 → 레지스트리 주소(계정ID)는 원본 유지. CI 가 계정ID 를 알 필요가 없다.
            #   [^[:space:]]* → 공백 앞에서 멈추므로 뒤따르는 설명 주석이 보존된다.
            sed -i -E \
              "s|^([[:space:]]*image:[[:space:]]*[^[:space:]]*hailcast-dev-${svc}):[^[:space:]]*|\1:${TAG}|" \
              "$f"

            # 치환 실패를 그냥 넘기면 옛 이미지가 계속 배포된다. 반드시 job 을 실패시킨다.
            grep -q "hailcast-dev-${svc}:${TAG}" "$f" \
              || { echo "::error file=${f}::이미지 태그 치환 실패. 이미지 라인 형식이 바뀌었는지 확인한다."; exit 1; }

            # 검증한 파일을 그 자리에서 스테이징한다. 커밋 스텝에 목록을 또 적으면 어긋난다.
            git add "$f"
            echo "갱신: ${svc} → ${TAG}"
            updated=$((updated + 1))
          done

          [ "$updated" -gt 0 ] || echo "갱신할 매니페스트 없음(빌드된 서비스의 매니페스트가 아직 없다)."
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # 봇 브랜치+PR 방식은 'PR 이 열려 있는 동안 dev 가 전진하면 뒤처지는' 창이 생긴다.
      # 실제로 그 창(70분)에 다른 PR 이 끼어들어 인접 라인 충돌이 났다.
      # dev 로 바로 push 하면 체크아웃~push 간격이 몇 초라 그 창이 사실상 사라진다.
      - name: Commit & push to dev
        env:
          TAG: ${{ steps.sed.outputs.tag }}
        run: |
          set -euo pipefail

          # 파일은 앞 스텝에서 이미 스테이징됐다. --cached 로 봐야 감지된다.
          # 이미 최신이면 커밋할 게 없다. 방치하면 git commit 이 실패해 job 이 빨개진다.
          if git diff --cached --quiet; then
            echo "변경 없음 — 이미 ${TAG} 로 최신이다. 스킵한다."
            exit 0
          fi

          # 표시용일 뿐 권한과는 무관하다 — 룰셋 bypass 는 커밋에 적힌 이름이 아니라
          # push 에 실제로 쓰인 토큰(위 App 설치 토큰)으로 판정된다.
          # app-slug 는 App 이름에서 나오므로 App 을 hailcast-ci 로 만들었다면
          # 결과 문자열이 종전과 같아 커밋 히스토리가 끊기지 않는다.
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          # 어떤 서비스가 바뀌었는지는 스테이징된 파일에서 뽑는다.
          # 커밋 메시지에 서비스명을 하드코딩하면 목록이 늘 때 또 어긋난다.
          # 구분자는 ASCII 로 둔다. paste -d 는 멀티바이트(·)를 바이트 단위로 잘라 메시지가 깨진다.
          svcs="$(git diff --cached --name-only | sed -E 's|apps/([^/]+)/.*|\1|' | sort -u | paste -sd, -)"

          # [skip ci]: 지금 manifests 에는 워크플로가 하나도 없어 당장은 무해하다.
          # 다만 App 설치 토큰으로 push 하면 GitHub 의 기본 루프 방지가 걸리지 않으므로
          # 미리 넣어 둔다(면제되는 건 GITHUB_TOKEN 뿐이다. PAT 시절과 근거가 같다).
          git commit \
            -m "chore(deploy): ${svcs} 이미지 태그 ${TAG} 로 갱신 [skip ci]" \
            -m "app 레포 커밋: ${GITHUB_SHA}" \
            -m "워크플로: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # 체크아웃과 push 사이에 누가 dev 로 push 하면 non-fast-forward 로 거부된다.
          # 그때는 rebase 로 따라잡고 다시 시도한다. 우리 변경은 이미지 라인뿐이라
          # 다른 파일 변경과는 깨끗하게 합쳐진다.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BASE_BRANCH}"; then
              echo "push 성공 (시도 ${attempt})"
              exit 0
            fi

            echo "::warning::dev 가 전진했다. rebase 후 재시도한다 (${attempt}/3)"
            if ! git pull --rebase origin "${BASE_BRANCH}"; then
              git rebase --abort || true
              echo "::error::rebase 충돌. dev 에서도 이미지 라인이 수정되었는지 확인한다."
              exit 1
            fi
            sleep 5
          done

          echo "::error::3회 재시도 후에도 push 실패. dev 가 계속 전진 중인지 확인한다."
          exit 1
