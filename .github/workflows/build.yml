# 9.1 build→ECR push (OIDC·SHA 태그) 골격
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC — 장기 AWS 키 없이 AssumeRole
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [call-api, worker, predict, simulator, weather-cron]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (SHA 태그 + latest)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: hailcast-${{ matrix.service }}
        run: |
          # build context = 레포 루트 (common/·ml/ 공유 모듈 COPY)
          docker build -f ${{ matrix.service }}/Dockerfile \
            -t "$REGISTRY/$IMAGE:${GITHUB_SHA::7}" \
            -t "$REGISTRY/$IMAGE:latest" .
          docker push "$REGISTRY/$IMAGE:${GITHUB_SHA::7}"
          docker push "$REGISTRY/$IMAGE:latest"
